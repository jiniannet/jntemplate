version: 2.5.0.{build}
image:
- Visual Studio 2026
- Ubuntu2404
configuration: Release
platform: Any CPU
before_build:
- ps: .\build\fix-target-framework.ps1
- sh: >-
    chmod +x ./build/fix-target-framework.sh
    bash ./build/fix-target-framework.sh
    dotnet --version 
    dotnet restore
build:
  project: JinianNet.JNTemplate.sln
  verbosity: minimal
after_build:
- sh: dotnet build
test_script:
- sh: dotnet test